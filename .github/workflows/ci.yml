name: Godot and Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_candidate:
        description: Build and test using the explicitly authorized release signing secrets
        type: boolean
        default: false
      graphics_backend:
        description: Emulator graphics diagnostic; both choices use software rendering on this runner
        type: choice
        options: [host, lavapipe]
        default: host
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GODOT_VERSION: 4.7.2
      MOCHI_EMULATOR_GPU: ${{ inputs.graphics_backend || 'host' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download and verify official engine and templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .local/tools
          cd .local/tools
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL --retry 3 "$base/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          curl -fsSL --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          sha512sum --ignore-missing --check SHA512-SUMS.txt
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -j "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" templates/android_debug.apk -d "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -j "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" templates/android_release.apk -d "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Import and execute rules and integration tests
        shell: bash
        run: |
          set -euo pipefail
          engine="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          "$engine" --headless --editor --path . --import
          python3 scripts_tools/run_checks.py --engine "$engine"
      - name: Configure Android tools and debug signing
        env:
          ANDROID_HOME: ${{ runner.temp }}/mochi-android-sdk
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          # Pin the official CLI archive; hosted runner PATH/SDK contents change.
          curl --http1.1 -fsSL --retry 3 --retry-all-errors https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip -o .local/tools/android-tools.zip
          printf '0877a1d048fe4a24efe2eff536ca4223f7adeb58648bb81909d33c446918cfa8  .local/tools/android-tools.zip\n' | sha256sum --check
          mkdir -p "$ANDROID_HOME/cmdline-tools" "$RUNNER_TEMP/mochi-android-unpack"
          unzip -q .local/tools/android-tools.zip -d "$RUNNER_TEMP/mochi-android-unpack"
          mv "$RUNNER_TEMP/mochi-android-unpack/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for i in {1..100}; do printf 'y\n'; done | "$sdkmanager" --sdk_root="$ANDROID_HOME" --licenses > .local/android-licenses.log
          "$sdkmanager" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          mkdir -p .local/android
          keytool -genkeypair -keystore .local/android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p "$HOME/.config/godot"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_HOME" "$JAVA_HOME" > "$HOME/.config/godot/editor_settings-4.7.tres"
      - name: Build development APK
        if: ${{ !inputs.release_candidate }}
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/.local/android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p dist
          Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . --export-debug Android dist/MochiArcade-dev.apk
          echo 'MOCHI_APK=dist/MochiArcade-dev.apk' >> "$GITHUB_ENV"
      - name: Build and verify signed release candidate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_candidate }}
        env:
          MOCHI_RELEASE_KEYSTORE_BASE64: ${{ secrets.MOCHI_RELEASE_KEYSTORE_BASE64 }}
          MOCHI_RELEASE_PASSWORD: ${{ secrets.MOCHI_RELEASE_PASSWORD }}
        run: |
          python3 scripts_tools/build_ci_release.py --engine "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo 'MOCHI_APK=dist/MochiArcade.apk' >> "$GITHUB_ENV"
      - name: Install pinned Android runtime tools
        shell: bash
        run: |
          set -euo pipefail
          # Retry only interrupted SDK transfers; app launches/tests are never retried.
          for attempt in 1 2 3; do
            if "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "emulator" "system-images;android-34;default;x86_64"; then break; fi
            if [[ "$attempt" == 3 ]]; then exit 1; fi
            sleep 5
          done
          # Versions verified against Google's stable repository metadata on 2026-10-22.
          # Fail on drift rather than silently adopting a different test environment.
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          sdk = Path(os.environ['ANDROID_HOME'])
          for relative, expected in [('emulator', (37, 2, 12)), ('system-images/android-34/default/x86_64', (4, 0, 0))]:
              props = dict(line.split('=', 1) for line in (sdk / relative / 'source.properties').read_text().splitlines() if '=' in line)
              # AOSP r04 contains stale source.properties revision 2. SDK package.xml
              # records the installed repository revision and is authoritative here.
              metadata = ET.parse(sdk / relative / 'package.xml')
              revision = next(node for node in metadata.iter() if node.tag.rsplit('}', 1)[-1] == 'revision')
              fields = {node.tag.rsplit('}', 1)[-1]: int(node.text) for node in revision}
              normalized = tuple(fields.get(name, 0) for name in ('major', 'minor', 'micro'))
              print(f'{relative}: package.xml {normalized}; source.properties {props["Pkg.Revision"]!r}')
              assert normalized == expected, f'Unexpected tool revision: {normalized} != {expected}'
          PY
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-mochi-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check
          # Only these three job-created, verified archives are disposable after extraction.
          # Keep installed tools, APKs, logs and all unrelated runner paths intact.
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path('.local/tools').resolve()
          version = os.environ['GODOT_VERSION']
          for name in (f'Godot_v{version}-stable_linux.x86_64.zip', f'Godot_v{version}-stable_export_templates.tpz', 'android-tools.zip'):
              archive = root / name
              assert archive.parent == root and archive.is_file() and not archive.is_symlink()
              print(f'Removing extracted job archive: {archive.name} ({archive.stat().st_size} bytes)')
              archive.unlink()
          PY
          df -h "$ANDROID_HOME" "$RUNNER_TEMP"
      - name: Boot dedicated AVD and run Android input smoke
        id: android_smoke
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/mochi-avd
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_AVD_HOME" .local/android-runtime
          case "$MOCHI_EMULATOR_GPU" in lavapipe|host) ;; *) exit 1 ;; esac
          if [[ "$MOCHI_EMULATOR_GPU" == 'host' ]]; then
            # Compare native host GLES/Mesa with ANGLE/Vulkan software rendering.
            # Xvfb is preinstalled on the hosted image; install no new package.
            command -v Xvfb
            dpkg-query -W xvfb libgl1-mesa-dri
            Xvfb -displayfd 3 -screen 0 720x1280x24 -nolisten tcp 3>.local/android-runtime/xvfb-display.txt >.local/android-runtime/xvfb.log 2>&1 &
            mochi_xvfb_pid=$!
            printf '%s\n' "$mochi_xvfb_pid" > .local/android-runtime/xvfb.pid
            for attempt in {1..20}; do
              if [[ -s .local/android-runtime/xvfb-display.txt ]]; then break; fi
              kill -0 "$mochi_xvfb_pid"
              sleep 0.25
            done
            read -r mochi_display_number < .local/android-runtime/xvfb-display.txt
            [[ "$mochi_display_number" =~ ^[0-9]+$ ]]
            export DISPLAY=":$mochi_display_number" LIBGL_ALWAYS_SOFTWARE=true GALLIUM_DRIVER=llvmpipe
            printf 'Xvfb PID=%s DISPLAY=%s; host GLES explicitly forced to Mesa software\n' "$mochi_xvfb_pid" "$DISPLAY"
          fi
          printf 'no\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n Mochi_CI_API34 -k 'system-images;android-34;default;x86_64' -d pixel_2
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path(os.environ['ANDROID_AVD_HOME']) / 'Mochi_CI_API34.avd/config.ini'
          values = dict(line.split('=', 1) for line in path.read_text().splitlines() if '=' in line)
          values.update({'hw.lcd.width': '720', 'hw.lcd.height': '1280', 'hw.lcd.density': '320', 'hw.ramSize': '2048', 'hw.cpu.ncore': '2', 'disk.dataPartition.size': '2G', 'disk.cachePartition.size': '128M', 'hw.sdCard': 'no'})
          path.write_text('\n'.join(f'{key}={value}' for key,value in values.items()) + '\n')
          PY
          "$ANDROID_HOME/emulator/emulator" -avd Mochi_CI_API34 -no-window -no-audio -no-boot-anim -no-snapshot -gpu "$MOCHI_EMULATOR_GPU" -accel on -memory 2048 -cores 2 -partition-size 2048 -camera-back none -camera-front none > .local/android-runtime/emulator.log 2>&1 &
          emulator_pid=$!
          printf '%s\n' "$emulator_pid" > .local/android-runtime/emulator.pid
          smoke_args=(--apk "$MOCHI_APK" --output .local/android-runtime --emulator-pid "$emulator_pid")
          if [[ "${{ inputs.release_candidate }}" == 'true' ]]; then smoke_args+=(--release); fi
          python3 scripts_tools/android_smoke.py "${smoke_args[@]}"
      - name: Measure maximum-pool Android render bursts
        if: ${{ !cancelled() && (steps.android_smoke.outcome == 'success' || steps.android_smoke.outcome == 'failure') }}
        shell: bash
        run: |
          set -euo pipefail
          load_args=(--apk "$MOCHI_APK" --output .local/android-runtime/load)
          if [[ "${{ inputs.release_candidate }}" == 'true' ]]; then load_args+=(--release); fi
          # Preserve guest logs even if the AVD becomes unreachable during a load.
          adb -s emulator-5554 logcat -v threadtime > .local/android-runtime/load-stream-logcat.txt 2>&1 &
          mochi_logcat_pid=$!
          trap 'kill "$mochi_logcat_pid" 2>/dev/null || true' EXIT
          python3 scripts_tools/android_load.py "${load_args[@]}"
      - name: Retain AVD host state
        if: always()
        shell: bash
        run: |
          mkdir -p .local/android-runtime
          # Read-only diagnostics of this disposable job; never reboot/retry a failure.
          {
            date --iso-8601=seconds
            free -m
            df -h "$RUNNER_TEMP"
            for name in emulator xvfb; do
              if [[ -r ".local/android-runtime/$name.pid" ]]; then
                read -r mochi_pid < ".local/android-runtime/$name.pid"
                printf '%s PID %s\n' "$name" "$mochi_pid"
                ps -p "$mochi_pid" -o pid,ppid,state,etime,rss,vsz,comm || true
              fi
            done
            timeout 10s adb devices -l || true
            sudo dmesg --ctime | tail -n 80 || true
          } > .local/android-runtime/host-state.txt 2>&1
      - name: Upload Android runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-runtime-evidence
          path: .local/android-runtime/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.release_candidate && 'signed-candidate-and-tests' || 'development-apk-and-tests' }}
          path: |
            dist/MochiArcade-dev.apk
            dist/MochiArcade.apk
            .local/release-signature.txt
            docs/evidence/*tests.json
            docs/evidence/vertical-slices.json
            docs/evidence/fruit-playthrough-*.json
            docs/evidence/bubble-playthrough-*.json
            docs/evidence/hop-playthrough-*.json
            docs/evidence/trio-playthrough-*.json
            docs/evidence/balls-playthrough-*.json
            docs/evidence/jelly-playthrough-*.json
            docs/evidence/vertical-playthrough-*.json
            docs/evidence/collection-audit.json
            docs/evidence/required-checks.json
            .local/check-logs/
          retention-days: 14
