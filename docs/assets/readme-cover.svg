<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470" role="img" aria-labelledby="t d">
<title id="t">Mochi Arcade — a softer place to play</title>
<desc id="d">Original pastel vector illustration of eight small arcade-game motifs, bouncy objects, fruit, tiles and a smiling bunny. Not an in-game screenshot.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#FFF3E9"/><stop offset=".52" stop-color="#F8E8EE"/><stop offset="1" stop-color="#E4EAFB"/></linearGradient>
<linearGradient id="coral" x2="1"><stop stop-color="#DC778A"/><stop offset="1" stop-color="#BB70A2"/></linearGradient>
<pattern id="confetti" width="63" height="63" patternUnits="userSpaceOnUse"><circle cx="10" cy="16" r="3" fill="#EAADAA" opacity=".36"/><circle cx="48" cy="49" r="2.5" fill="#A1B9E8" opacity=".38"/></pattern>
</defs>
<rect width="1500" height="470" rx="21" fill="url(#bg)"/>
<rect width="1500" height="470" rx="21" fill="url(#confetti)"/>
<path d="M0 430Q300 405 570 436T1500 425V470H0Z" fill="#FFFFFF" opacity=".36"/>
<g font-family="Segoe UI,Arial,sans-serif">
<rect x="82" y="63" width="238" height="36" rx="18" fill="#FEFDFB" stroke="#E9C7C1"/>
<circle cx="105" cy="81" r="5" fill="#E8A6A2"/>
<text x="123" y="88" font-size="16" font-weight="750" letter-spacing="2.3" fill="#967186">EIGHT LITTLE GAMES</text>
<text x="74" y="200" font-size="76" font-weight="850" letter-spacing="-3" fill="#825E7B">A SOFTER</text>
<text x="75" y="287" font-size="76" font-weight="850" letter-spacing="-3" fill="url(#coral)">PLACE TO PLAY</text>
<text x="81" y="348" font-size="26" fill="#977A8A">Drop. Bounce. Stack. Match. Smile.</text>
<path d="M83 377H678" stroke="#B28FA4" stroke-opacity=".4"/>
<text x="83" y="414" font-size="16" letter-spacing="2.6" font-weight="700" fill="#AB7C8E">COZY  ·  OFFLINE  ·  NO ACCOUNTS</text>
</g>
<!-- Eight original symbolic cards, not captured UIs. -->
<g stroke="#FFFFFF" stroke-width="4">
<rect x="812" y="59" width="133" height="161" rx="28" fill="#FFDCDA"/>
<rect x="963" y="59" width="133" height="161" rx="28" fill="#D0EBF0"/>
<rect x="1114" y="59" width="133" height="161" rx="28" fill="#F9E5B9"/>
<rect x="1265" y="59" width="133" height="161" rx="28" fill="#E6D9F8"/>
