<rect x="963" y="239" width="133" height="161" rx="28" fill="#F9D2DF"/>
<rect x="1114" y="239" width="133" height="161" rx="28" fill="#D9E1FA"/>
<rect x="1265" y="239" width="133" height="161" rx="28" fill="#F5D8CE"/>
</g>
